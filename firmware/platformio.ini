; MecanumBot firmware — DESIGN.md §4.2
[platformio]
default_envs = esp32c6

[env:esp32c6]
; TODO(DESIGN §11): drop pioarduino once the official espressif32 platform ships Arduino core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; test/ holds host-only tests (own main(), file IO): run them with -e native
test_ignore = *
build_flags =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DFW_MAJOR=0 -DFW_MINOR=1

[env:esp32c6_ota]
extends = env:esp32c6
upload_protocol = espota
upload_port = mecanumbot.local
upload_flags = --auth=changeme

; Host tests for the pure C++ libs: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=c++17
    -Wall -Wextra
    '-DVECTORS_PATH="${PROJECT_DIR}/../protocol/vectors.json"'
lib_ignore = motors, storage, link, telemetry, wifi_ota, ota_usb
lib_deps = bblanchon/ArduinoJson@^7.2
